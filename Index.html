<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Truy Cập - Phần Mềm Quản Lý X-Quang Dịch Vụ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Medical Cross Pattern Background */
        .medical-bg {
            background-color: #f8fafc;
            background-image: radial-gradient(#0284c7 0.75px, transparent 0.75px), radial-gradient(#0284c7 0.75px, #f8fafc 0.75px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            background-opacity: 0.05;
        }

        /* Medical Glow Animation for Primary Button */
        @keyframes medicalGlow {
            0%, 100% {
                box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.4), 0 8px 10px -6px rgba(2, 132, 199, 0.2);
            }
            50% {
                box-shadow: 0 15px 30px -5px rgba(2, 132, 199, 0.6), 0 10px 12px -5px rgba(2, 132, 199, 0.3);
            }
        }

        .btn-medical-glow {
            animation: medicalGlow 3s infinite ease-in-out;
        }

        .btn-medical-glow:hover {
            animation: none;
            box-shadow: 0 20px 35px -5px rgba(2, 132, 199, 0.7), 0 12px 15px -5px rgba(2, 132, 199, 0.4);
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="medical-bg min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">

    <!-- Main Container Card -->
    <main class="w-full max-w-xl">
        <div class="glass-card rounded-3xl p-8 md:p-12 shadow-2xl shadow-slate-200/60 border border-slate-100 text-center relative overflow-hidden transition-all duration-300">
            
            <!-- Top Accent Line -->
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-sky-400 via-blue-600 to-teal-400"></div>

            <!-- Hospital / X-Ray Icon Badge -->
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-sky-50 text-sky-600 mb-6 border border-sky-100 shadow-inner group">
                <i class="fa-solid fa-x-ray text-3xl group-hover:scale-110 transition-transform duration-300"></i>
            </div>

            <!-- Title Section -->
            <div class="mb-8">
                <span class="inline-block px-3 py-1 mb-3 text-xs font-semibold tracking-wider text-sky-700 uppercase bg-sky-100/80 rounded-full">
                    Hệ Thống Y Tế
                </span>
                <h1 class="text-2xl md:text-3xl font-bold text-slate-800 tracking-tight mb-2">
                    Cổng Truy Cập Hệ Thống
                </h1>
                <p class="text-sm md:text-base text-slate-500 max-w-sm mx-auto leading-relaxed">
                    Vui lòng bấm nút bên dưới để chuyển hướng sang phần mềm quản lý X-quang chuyên dụng.
                </p>
            </div>

            <!-- 
                ============================================================
                DÁN LINK PHẦN MỀM GỐC CỦA BẠN VÀO THẺ <a> DƯỚI ĐÂY 
                Thay href="#" bằng URL thực tế (ví dụ: href="https://phanmem-xquang.benhvien.com")
                ============================================================
            -->
            <div class="my-6">
                <a href="https://script.google.com/macros/s/AKfycbzWHP9CI3mvkTXvsZzfAbkNPET8uDcfFaCMNW-PvnGM_NNEgVm4dptrbx5_inDvHgKJ/exec" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   class="btn-medical-glow inline-flex items-center justify-center gap-3 w-full py-4 px-6 text-white font-semibold text-base md:text-lg bg-gradient-to-r from-sky-600 via-blue-600 to-teal-600 hover:from-sky-500 hover:via-blue-500 hover:to-teal-500 rounded-2xl transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0 cursor-pointer">
                    <i class="fa-solid fa-laptop-medical text-xl"></i>
                    <span>TRUY CẬP PHẦN MỀM QUẢN LÝ XQUANG DỊCH VỤ</span>
                    <i class="fa-solid fa-arrow-right text-sm opacity-80 group-hover:translate-x-1 transition-transform"></i>
                </a>
            </div>

            <!-- Security & Status Info -->
            <div class="pt-6 border-t border-slate-100 flex items-center justify-center gap-4 text-xs text-slate-400">
                <span class="flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Hệ thống hoạt động
                </span>
                <span class="text-slate-300">•</span>
                <span class="flex items-center gap-1">
                    <i class="fa-solid fa-shield-halved text-sky-600"></i> Kết nối an toàn
                </span>
            </div>

        </div>

        <!-- Footer Copyright -->
        <footer class="mt-6 text-center text-xs text-slate-400">
            &copy; 2026 Phần Mềm Quản Lý Y Tế & X-Quang Dịch Vụ. All rights reserved.
        </footer>
    </main>

</body>
</html>
